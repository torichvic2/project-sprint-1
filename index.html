<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<section>
    <div class="card">
        <div class="product-image-block">
            <img class="main-image" src="./assets/images/main-img.png" alt="selected cup">
            <div class="preview selected" >
                <img src="./assets/images/preview-1.png" alt="first preview cup">
            </div>
            <div class="preview" >
                <img src="./assets/images/preview-2.png" alt="second preview cup">
            </div>
        </div>
        <div class="product-info-block">
            <h1 class="main-title">Fluted Contrast</h1>
            <span class="subtitle">Mug / 33 cl</span>
            <p class="text">Fluted Contrast represents the perfect fusion between the aesthetic and the functional. The design is
                elegant and modern, created out of a deep for Royal British history and traditions</p>
            <div class="colors">
                <h2 class="title">Color options</h2>
                <ul>
                    <li class="selected">
                        <div class="circle blue"></div>
                    </li>
                    <li>
                        <div class="circle green"></div>
                    </li>
                    <li>
                        <div class="circle red"></div>
                    </li>
                    <li>
                        <div class="circle black"></div>
                    </li>
                    <li>
                        <div class="circle yellow"></div>
                    </li>
                </ul>
            </div>
            <div>
                <div>
                    <h2 class="title">Quantity</h2>
                    <select class ="quantity" name="quantity" id="quantity">
                        <option value="">1</option>
                        <option value="">2</option>
                        <option value="">3</option>
                    </select>
                </div>
                <div>
                    <h2 class="title">Price</h2>
                    <span class="price">eur 39,00</span>
                </div>
            </div>
            <button class="btn">Add To Basket</button>
        </div>
    </div>
</section>
</body>
</html>
